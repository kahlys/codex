name: Reusable Rust CI

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      toolchain:
        required: false
        type: string
        default: 'stable'

jobs:
  rust-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfreetype-dev \
            libxcb1-dev

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: cargo test --verbose

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: cargo build --verbose