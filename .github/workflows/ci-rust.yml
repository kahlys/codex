name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  call-rust-ci:
    uses: ./.github/workflows/reusable-rust.yml
    with:
      working-directory: '.'        # Mets ton dossier (ex: '.' si c'est à la racine)
      toolchain: 'stable'           # Ou une version spécifique (ex: '1.75.0')