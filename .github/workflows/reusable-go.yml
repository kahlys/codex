name: Reusable Go CI

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      go-version:
        required: false
        type: string
        default: '1.27.0'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: go test ./...

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: go build ./...