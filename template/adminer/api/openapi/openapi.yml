components:
  securitySchemes:
    userAuth:
      type: apiKey
      name: SESSION_ID 
      in: cookie
    adminAuth:
      type: apiKey
      name: SESSION_ID 
      in: cookie
  schemas:
    UserBase:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    
    User:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            id:
              type: integer
          required:
            - id